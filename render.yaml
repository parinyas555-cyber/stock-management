services:
  - type: web
    name: stock-management
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health.php
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stock-management-db
          property: connectionString
      - key: APP_NAME
        value: Stock Management

databases:
  - name: stock-management-db
    plan: free
    databaseName: stock_management
    user: stock_admin
